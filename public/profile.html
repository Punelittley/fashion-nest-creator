<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIAODQQ | Личное Пространство</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="common-styles.css">
    <style>
        .banner-wrap { position: absolute; top: 0; left: 0; width: 100%; height: 85vh; z-index: 0; overflow: hidden; }
        .banner-img { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; filter: saturate(0.7); }
        .banner-overlay { position: absolute; bottom: 0; left: 0; width: 100%; height: 50%; background: linear-gradient(to top, var(--bg) 5%, transparent 100%); }
        .avatar-main { width: 180px; height: 180px; border-radius: 50%; padding: 6px; background: linear-gradient(45deg, var(--accent), #3b82f6); position: relative; box-shadow: 0 0 40px var(--accent-glow); }
        .avatar-main img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; border: 5px solid #000; }
        .friend-avatar { width: 45px; height: 45px; border-radius: 14px; border: 1px solid var(--border); transition: 0.3s; }
        .friend-avatar:hover { border-color: var(--accent); }
        .post-create-area textarea { background: transparent; border: none; width: 100%; resize: none; color: #fff; font-size: 16px; outline: none; font-family: 'Inter', sans-serif; }
        .post-create-area textarea::placeholder { color: rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <header class="header-float"><div class="header-float-inner"><a href="index.html" class="header-logo huge-text text-lg">SIAODQQ</a><div class="header-nav-pills" id="nav-links"></div><div class="header-actions" id="nav-actions"></div></div></header>
    <div class="banner-wrap"><img src="https://images.unsplash.com/photo-1614850523296-d8c1af93d400?w=1600" class="banner-img" id="banner"><div class="banner-overlay"></div></div>
    <main class="max-w-[1600px] mx-auto px-10 pt-24 pb-40 relative z-10" style="margin-top: 200px;">
        <div class="glass-card mb-8">
            <div class="flex flex-col lg:flex-row items-center lg:items-end gap-10">
                <div class="avatar-main"><img id="profile-avatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Alexander" alt="Avatar"></div>
                <div class="flex-1 text-center lg:text-left">
                    <div class="flex flex-col lg:flex-row justify-between items-center lg:items-end gap-6">
                        <div><h1 class="huge-text text-6xl lg:text-8xl" id="profile-name">...</h1><p class="text-purple-400 font-black uppercase tracking-[0.4em] text-[12px] mt-4" id="profile-tagline">...</p></div>
                        <button onclick="location.href='edit_info.html'" class="bg-white text-black px-12 py-4 rounded-full font-black uppercase text-[10px] hover:bg-purple-500 hover:text-white transition duration-500 border-none cursor-pointer">Редактировать</button>
                    </div>
                </div>
            </div>
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-8 mt-16 pt-16 border-t border-white/5">
                <div><span class="text-[10px] opacity-30 font-bold uppercase tracking-widest">Просмотры</span><p class="text-3xl font-black mt-1 tracking-tighter">1.2M</p></div>
                <div><span class="text-[10px] opacity-30 font-bold uppercase tracking-widest">Друзья</span><p class="text-3xl font-black mt-1 tracking-tighter" id="stat-friends">0</p></div>
                <div><span class="text-[10px] opacity-30 font-bold uppercase tracking-widest">Публикации</span><p class="text-3xl font-black mt-1 tracking-tighter" id="stat-posts">0</p></div>
                <div><span class="text-[10px] opacity-30 font-bold uppercase tracking-widest">Ранг</span><p class="text-3xl font-black mt-1 text-purple-400 tracking-tighter">Top 1%</p></div>
            </div>
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            <div class="lg:col-span-4 space-y-8">
                <div class="glass-card"><h3 class="huge-text text-xl mb-6">Manifesto</h3><p class="text-sm text-white/60 leading-relaxed italic" id="profile-bio">...</p><div class="mt-8 space-y-4"><div class="flex justify-between text-[11px]"><span class="opacity-30 uppercase font-bold">Дата регистрации</span><span id="profile-date">—</span></div></div></div>
                <div class="glass-card"><div class="flex justify-between items-center mb-6"><h3 class="huge-text text-xl">Друзья</h3><a href="friends.html" class="text-[10px] font-bold text-purple-400 hover:text-white transition" style="text-decoration:none;">Все →</a></div><div class="grid grid-cols-5 gap-3" id="friends-grid"><div class="friend-avatar bg-white/5 flex items-center justify-center text-[10px] opacity-30">...</div></div></div>
            </div>
            <div class="lg:col-span-8 space-y-8">
                <div class="glass-card post-create-area"><div class="flex gap-5"><div class="w-12 h-12 rounded-2xl bg-neutral-800 shrink-0 overflow-hidden"><img id="post-create-avatar" src="" class="w-full h-full object-cover"></div><textarea id="postText" rows="3" placeholder="О чем вы думаете?"></textarea></div><div class="flex justify-end mt-6 pt-6 border-t border-white/5"><button class="btn-create px-8" onclick="createPost()">Опубликовать</button></div></div>
                <div id="userPosts"><div class="glass-card"><div class="flex items-center justify-center py-16"><p class="text-sm opacity-30 uppercase font-bold tracking-widest">Загрузка...</p></div></div></div>
            </div>
        </div>
    </main>
    <script src="common.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!requireAuth()) return;
            const user = getUser();
            if (user) {
                document.getElementById('profile-name').textContent = user.name || user.username;
                document.getElementById('profile-tagline').textContent = user.tagline || 'Новый участник SIAODQQ';
                document.getElementById('profile-bio').textContent = user.bio || 'Пока нет описания...';
                const av = user.avatar || `https://api.dicebear.com/7.x/avataaars/svg?seed=${user.username}`;
                document.getElementById('profile-avatar').src = av;
                document.getElementById('post-create-avatar').src = av;
                if (user.banner) document.getElementById('banner').src = user.banner;
            }
            loadMyPosts(); loadMyFriends();
        });
        async function loadMyFriends() {
            try { const r = await fetch('/api/friends',{headers:{'Authorization':'Bearer '+getToken()}}); const d = await r.json(); const f = d.friends||[];
                document.getElementById('stat-friends').textContent = f.length;
                const g = document.getElementById('friends-grid');
                g.innerHTML = f.length === 0 ? '<div class="friend-avatar bg-white/5 flex items-center justify-center text-[10px] opacity-30">Пусто</div>' : f.slice(0,5).map(u=>`<img src="${u.avatar||`https://api.dicebear.com/7.x/avataaars/svg?seed=${u.username}`}" class="friend-avatar bg-white/5 cursor-pointer" onclick="location.href='profile_user.html?user=${u.username}'" title="${u.name}">`).join('');
            } catch(e){}
        }
        async function loadMyPosts() {
            const user = getUser(); if (!user) return;
            try { const r = await fetch('/api/posts?userId='+user.id); const d = await r.json(); const p = d.posts||[];
                document.getElementById('stat-posts').textContent = p.length; renderPosts(p);
            } catch(e){ document.getElementById('userPosts').innerHTML = '<div class="glass-card"><div class="flex items-center justify-center py-16"><p class="text-sm opacity-30 uppercase font-bold tracking-widest">Пока нет публикаций</p></div></div>'; }
        }
        function renderPosts(posts) {
            const c = document.getElementById('userPosts');
            if (!posts.length) { c.innerHTML = '<div class="glass-card"><div class="flex items-center justify-center py-16"><p class="text-sm opacity-30 uppercase font-bold tracking-widest">Пока нет публикаций</p></div></div>'; return; }
            c.innerHTML = posts.map(p => { const av = p.author_avatar||`https://api.dicebear.com/7.x/avataaars/svg?seed=${p.author_username}`; return `<div class="glass-card mb-6"><div class="flex items-center gap-4 mb-8"><div class="w-12 h-12 rounded-2xl overflow-hidden bg-gradient-to-br from-indigo-500 to-purple-600"><img src="${av}" class="w-full h-full object-cover"></div><div><p class="font-bold">${p.author_name}</p><p class="text-[10px] opacity-30 font-bold uppercase">${getTimeAgo(p.created_at)}</p></div></div><p class="text-[18px] leading-relaxed text-white/90">${escapeHtml(p.text)}</p></div>`; }).join('');
        }
        async function createPost() { const t = document.getElementById('postText'); const text = t.value.trim(); if(!text) return; try { const r = await fetch('/api/posts',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+getToken()},body:JSON.stringify({text})}); if(r.ok){t.value='';loadMyPosts();} } catch(e){} }
        function getTimeAgo(d){const now=new Date(),date=new Date(d),diff=Math.floor((now-date)/1000);if(diff<60)return'только что';if(diff<3600)return Math.floor(diff/60)+' мин. назад';if(diff<86400)return Math.floor(diff/3600)+' ч. назад';return Math.floor(diff/86400)+' дн. назад';}
        function escapeHtml(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML;}
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIAODQQ | Соцсеть нового поколения</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="common-styles.css">
    <style>
        .bg-glow {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
        }
        .blob {
            position: absolute; width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.1) 0%, transparent 70%);
            border-radius: 50%; filter: blur(80px);
        }
        .post-img {
            width: 100%; height: 450px; object-fit: cover;
            border-radius: 24px; filter: brightness(0.9);
        }
        .post-create-area textarea {
            background: transparent; border: none; width: 100%; resize: none; color: #fff;
            font-size: 16px; outline: none; font-family: 'Inter', sans-serif;
        }
        .post-create-area textarea::placeholder { color: rgba(255,255,255,0.2); }
    </style>
</head>
<body>

    <header class="header-float">
        <div class="header-float-inner">
            <a href="index.html" class="header-logo huge-text text-lg">SIAODQQ</a>
            <div class="header-nav-pills" id="nav-links"></div>
            <div class="header-actions" id="nav-actions"></div>
        </div>
    </header>

    <div class="bg-glow">
        <div class="blob" id="blob-1" style="top: -10%; left: -10%;"></div>
        <div class="blob" id="blob-2" style="bottom: 10%; right: 10%; background: radial-gradient(circle, rgba(59, 130, 246, 0.07) 0%, transparent 70%);"></div>
    </div>

    <main class="max-w-[1400px] mx-auto pt-24 px-10 pb-20 relative z-10 grid grid-cols-1 xl:grid-cols-[300px_700px_300px] gap-8 justify-center">
        <div class="hidden xl:block"></div>

        <div class="space-y-8">
            <!-- Создание поста -->
            <div class="glass p-8 post-create-area" id="postCreateArea" style="display:none;">
                <div class="flex gap-5">
                    <div class="w-12 h-12 rounded-2xl bg-neutral-800 shrink-0 overflow-hidden">
                        <img id="feed-avatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Siaodqq" alt="Avatar" class="w-full h-full object-cover">
                    </div>
                    <textarea id="feedPostText" rows="2" placeholder="О чем вы думаете?"></textarea>
                </div>
                <div class="flex justify-end mt-6 pt-6 border-t border-white/5">
                    <button class="btn-create px-8" onclick="createFeedPost()">Опубликовать</button>
                </div>
            </div>

            <!-- Посты -->
            <div id="feedPosts">
                <div class="glass p-8 text-center">
                    <p class="text-xs opacity-30 uppercase font-bold">Загрузка ленты...</p>
                </div>
            </div>
        </div>

        <aside class="hidden xl:block">
            <div class="glass p-6 sticky top-28">
                <h4 class="text-[10px] font-black uppercase tracking-[0.2em] mb-8 opacity-30">Сейчас в сети</h4>
                <div class="space-y-6">
                    <div class="flex items-center gap-4 group cursor-pointer">
                        <div class="relative">
                            <div class="w-10 h-10 rounded-xl bg-neutral-800 overflow-hidden">
                                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Elena" alt="User">
                            </div>
                            <div class="absolute -bottom-1 -right-1 w-3.5 h-3.5 bg-purple-500 border-[3px] border-[#030303] rounded-full shadow-[0_0_10px_rgba(139,92,246,0.5)]"></div>
                        </div>
                        <div>
                            <p class="text-[13px] font-bold group-hover:text-purple-400 transition">Елена_Визуал</p>
                            <p class="text-[10px] opacity-20 uppercase font-black tracking-tighter">Дизайнер</p>
                        </div>
                    </div>
                </div>
            </div>
        </aside>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="common.js"></script>

    <script>
        function getTimeAgo(dateStr) {
            const now = new Date();
            const date = new Date(dateStr);
            const diff = Math.floor((now - date) / 1000);
            if (diff < 60) return 'только что';
            if (diff < 3600) return Math.floor(diff / 60) + ' мин. назад';
            if (diff < 86400) return Math.floor(diff / 3600) + ' ч. назад';
            return Math.floor(diff / 86400) + ' дн. назад';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const user = getUser();
            if (user) {
                const avatarEl = document.getElementById('feed-avatar');
                if (avatarEl) {
                    avatarEl.src = user.avatar || `https://api.dicebear.com/7.x/avataaars/svg?seed=${user.username}`;
                }
                document.getElementById('postCreateArea').style.display = 'block';
            }
            loadFeed();
        });

        async function loadFeed() {
            try {
                const res = await fetch('/api/posts');
                const data = await res.json();
                renderFeedPosts(data.posts || []);
            } catch(e) {
                // Показываем демо-пост при отсутствии сервера
                document.getElementById('feedPosts').innerHTML = `
                    <div class="glass p-8">
                        <div class="flex items-center justify-between mb-6">
                            <div class="flex items-center gap-4">
                                <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 shadow-lg shadow-purple-500/20"></div>
                                <div>
                                    <p class="font-bold text-[16px]">Артём Версаль</p>
                                    <p class="text-[10px] opacity-30 font-bold uppercase tracking-widest">15 минут назад</p>
                                </div>
                            </div>
                        </div>
                        <p class="text-[18px] leading-relaxed mb-8 text-white/90">SIAODQQ задает новый стандарт взаимодействия. Мы создаем пространство, где дизайн — это способ мыслить.</p>
                        <img src="https://images.unsplash.com/photo-1614850523296-d8c1af93d400?w=1200" class="post-img" alt="Post">
                    </div>
                `;
            }
        }

        function renderFeedPosts(posts) {
            const container = document.getElementById('feedPosts');
            if (posts.length === 0) {
                container.innerHTML = '<div class="glass p-8 text-center"><p class="text-xs opacity-30 uppercase font-bold">Лента пуста. Будьте первым!</p></div>';
                return;
            }
            container.innerHTML = posts.map(post => {
                const avatarSrc = post.author_avatar || `https://api.dicebear.com/7.x/avataaars/svg?seed=${post.author_username}`;
                return `
                    <div class="glass p-8 mb-8">
                        <div class="flex items-center justify-between mb-6">
                            <div class="flex items-center gap-4">
                                <div class="w-12 h-12 rounded-2xl overflow-hidden bg-gradient-to-br from-indigo-500 to-purple-600 shadow-lg shadow-purple-500/20">
                                    <img src="${avatarSrc}" class="w-full h-full object-cover">
                                </div>
                                <div>
                                    <p class="font-bold text-[16px] cursor-pointer hover:text-purple-400 transition" onclick="location.href='profile_user.html?user=${encodeURIComponent(post.author_username)}'">${post.author_name}</p>
                                    <p class="text-[10px] opacity-30 font-bold uppercase tracking-widest">${getTimeAgo(post.created_at)}</p>
                                </div>
                            </div>
                        </div>
                        <p class="text-[18px] leading-relaxed text-white/90">${escapeHtml(post.text)}</p>
                    </div>
                `;
            }).join('');
        }

        async function createFeedPost() {
            const textarea = document.getElementById('feedPostText');
            const text = textarea.value.trim();
            if (!text) return;
            try {
                const res = await fetch('/api/posts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getToken() },
                    body: JSON.stringify({ text })
                });
                if (res.ok) {
                    textarea.value = '';
                    loadFeed();
                }
            } catch(e) {
                console.error('Ошибка создания поста');
            }
        }

        const blob1 = document.getElementById('blob-1');
        const blob2 = document.getElementById('blob-2');
        window.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 60;
            const y = (e.clientY / window.innerHeight - 0.5) * 60;
            gsap.to(blob1, { x: x, y: y, duration: 2, ease: "power2.out" });
            gsap.to(blob2, { x: -x, y: -y, duration: 2, ease: "power2.out" });
        });

        gsap.registerPlugin(ScrollTrigger);
        gsap.utils.toArray(".glass").forEach((card) => {
            gsap.from(card, {
                opacity: 0, y: 40, duration: 1,
                scrollTrigger: { trigger: card, start: "top 95%" }
            });
        });
    </script>
</body>
</html>
